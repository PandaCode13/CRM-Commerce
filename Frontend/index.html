<!doctype html>
<html lang="fr" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Commerce - Marketplace de CRM Métier | Solutions sur Mesure</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.png" />

    <!-- SEO Prime -->
    <meta name="description" content="CRM Commerce est la première marketplace spécialisée dans les CRM métier. Découvrez, comparez et achetez des CRM prêts à l'emploi pour votre secteur d'activité." />
    <meta name="keywords" content="CRM, CRM métier, marketplace CRM, logiciel CRM, CRM secteur, CRM commerce, CRM personnalisable, gestion relation client" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="author" content="CRM Commerce" />
    <meta name="revisit-after" content="7 days" />
    <link rel="canonical" href="https://crm-commerce.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crm-commerce.com/" />
    <meta property="og:title" content="CRM Commerce - Marketplace de CRM Métier" />
    <meta property="og:description" content="Découvrez, comparez et achetez des CRM prêts à l'emploi pour votre secteur d'activité." />
    <meta property="og:image" content="https://crm-commerce.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CRM Commerce" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRM Commerce - Marketplace de CRM Métier" />
    <meta name="twitter:description" content="Découvrez, comparez et achetez des CRM prêts à l'emploi pour votre secteur d'activité." />
    <meta name="twitter:image" content="https://crm-commerce.com/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#05070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Commerce" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preload / Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" as="style" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CRM Commerce",
        "url": "https://crm-commerce.com/",
        "logo": "https://crm-commerce.com/logo.png",
        "description": "Marketplace spécialisée dans les CRM métier",
        "foundingDate": "2025",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "contact@crm-commerce.com"
        },
        "sameAs": [
          "https://twitter.com/crmcommerce",
          "https://linkedin.com/company/crmcommerce"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CRM Commerce",
        "url": "https://crm-commerce.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://crm-commerce.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
