name: mdsu-crm-beauty

services:
  db:
    image: mongo:8
    container_name: mdsu-crm-beauty-db
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - mdsu

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdsu-crm-beauty-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8201"
    environment:
      NODE_ENV: production
      PORT: "8201"
      MONGO_HOST: db
      MONGO_PORT: "27017"
      DB_NAME: ${DB_NAME}
      DB_USER: ${MONGO_USER}
      DB_PASSWORD: ${MONGO_PASSWORD}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/${DB_NAME}?authSource=admin
      CORS_ORIGIN: "http://localhost:${FRONTEND_PORT}"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mdsu

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdsu-crm-beauty-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - mdsu

volumes:
  db_data:
    driver: local

networks:
  mdsu:
    driver: bridge